<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ToDo+ | Productivity Simplified</title>
  <link rel="stylesheet" href="style1.css" />
</head>
<body>
  <header>
    <img src="assets/log.png" alt="ToDo+ Logo" class="logo">
    <h1>ToDo+</h1>
    <p>Kelola tugasmu dengan cerdas dan efisien 🚀</p>
  </header>

  <main>
    <section class="todo-container">
      <div class="input-section">
        <input type="text" id="taskInput" placeholder="Tambahkan tugas baru..." />
        <button id="addTaskBtn">Tambah</button>
      </div>

      <ul id="taskList"></ul>
    </section>
  </main>

  <footer>
    <p>© 2025 ToDo+ by Trial Code. All rights reserved.</p>
  </footer>

  <script src="projects/scrip.js"></script>
</body>
</html>
